<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betting Tools — OddsJam Powered</title>
<style>
:root {
  --bg: #0a0e17; --surface: #111827; --surface2: #1a2332; --border: #2a3a4a;
  --text: #e2e8f0; --text2: #94a3b8; --accent: #22c55e; --accent2: #3b82f6;
  --danger: #ef4444; --warn: #eab308; --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'SF Mono',SFMono-Regular,ui-monospace,monospace; font-size:14px; }
.container { max-width:1600px; margin:0 auto; padding:20px; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:20px; }
.header h1 { font-size:20px; font-weight:700; color:var(--accent); }
.header .live { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--accent); }
.header .live .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Tabs */
.tabs { display:flex; gap:2px; margin-bottom:20px; flex-wrap:wrap; }
.tab { padding:10px 24px; background:var(--surface); border:1px solid var(--border); border-bottom:none; color:var(--text2); cursor:pointer; font-size:13px; font-weight:600; border-radius:8px 8px 0 0; transition:all .15s; }
.tab:hover { color:var(--text); background:var(--surface2); }
.tab.active { color:var(--accent); background:var(--surface2); border-color:var(--accent); }

/* Controls */
.controls { display:flex; gap:12px; padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:0 8px 8px 8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.controls select, .controls input { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:6px; font-size:13px; font-family:inherit; }
.controls label { font-size:12px; color:var(--text2); display:flex; flex-direction:column; gap:4px; }
.controls .btn { background:var(--accent); color:#000; border:none; padding:8px 20px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
.controls .btn:hover { opacity:0.85; }
.controls .btn.secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }

/* Stats bar */
.stats-bar { display:flex; gap:16px; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; flex-wrap:wrap; }
.stat { display:flex; flex-direction:column; gap:2px; }
.stat .label { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; }
.stat .value { font-size:20px; font-weight:700; color:var(--accent); }
.stat .value.warn { color:var(--warn); }
.stat .value.purple { color:var(--purple); }
.stat .value.blue { color:var(--accent2); }

/* Table */
.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead { position:sticky; top:0; background:var(--surface2); z-index:1; }
th { padding:10px 14px; text-align:left; font-weight:600; color:var(--text2); text-transform:uppercase; font-size:11px; letter-spacing:0.5px; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
tr:hover { background:rgba(34,197,94,0.04); }
tr:last-child td { border-bottom:none; }

/* Badges */
.badge { display:inline-block; padding:3px 8px; border-radius:4px; font-size:11px; font-weight:700; }
.badge.green { background:rgba(34,197,94,0.15); color:var(--accent); }
.badge.red { background:rgba(239,68,68,0.15); color:var(--danger); }
.badge.blue { background:rgba(59,130,246,0.15); color:var(--accent2); }
.badge.purple { background:rgba(139,92,246,0.15); color:var(--purple); }
.badge.yellow { background:rgba(234,179,8,0.15); color:var(--warn); }
.badge.gray { background:rgba(148,163,184,0.15); color:var(--text2); }

/* Status */
.loading { display:flex; align-items:center; justify-content:center; padding:60px; color:var(--text2); font-size:14px; }
.error { display:flex; align-items:center; justify-content:center; padding:40px; color:var(--danger); font-size:14px; text-align:center; line-height:1.6; }
.empty { display:flex; align-items:center; justify-content:center; padding:60px; color:var(--text2); font-size:14px; }

/* EV colors */
.ev-pos { color:var(--accent); font-weight:700; }
.ev-neg { color:var(--danger); font-weight:700; }
.price-pos { color:var(--accent); }
.price-neg { color:var(--danger); }

/* Auto-refresh toggle */
.auto-refresh { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text2); cursor:pointer; user-select:none; }
.auto-refresh input { accent-color:var(--accent); }

/* Odds screen */
.book-header { font-size:11px; color:var(--text2); }
.odds-cell { text-align:center; font-weight:600; }
.odds-cell.pos { color:var(--accent); }
.odds-cell.neg { color:var(--danger); }
.odds-cell.dim { color:var(--text2); opacity:0.5; }

/* Responsive */
@media (max-width:768px) {
  .container { padding:10px; }
  .tabs { flex-direction:column; }
  .tab { border-radius:8px; border-bottom:1px solid var(--border); }
  .controls { flex-direction:column; align-items:stretch; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ Betting Tools</h1>
    <div class="live"><span class="dot"></span> OddsJam Live Data</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="ev">Positive EV</div>
    <div class="tab" data-tab="dfs">DFS Edge</div>
    <div class="tab" data-tab="arbitrage">Arbitrage</div>
    <div class="tab" data-tab="sharp">Smart Money</div>
    <div class="tab" data-tab="odds">Odds Screen</div>
  </div>

  <div class="controls" id="controls">
    <label>Sport
      <select id="sport-select" multiple>
        <option value="nfl" selected>NFL</option>
        <option value="nba" selected>NBA</option>
        <option value="mlb" selected>MLB</option>
        <option value="nhl" selected>NHL</option>
        <option value="cfb">CFB</option>
        <option value="cbb">CBB</option>
      </select>
    </label>
    <label>Market
      <select id="market-select">
        <option value="moneyline">Moneyline</option>
        <option value="point_spread">Spread</option>
        <option value="total_points">Total</option>
      </select>
    </label>
    <label id="min-ev-label">Min EV %
      <input type="number" id="min-ev" value="1.0" step="0.5" min="0" style="width:70px">
    </label>
    <label id="min-edge-label" style="display:none">Min Edge %
      <input type="number" id="min-edge" value="0.5" step="0.5" min="0" style="width:70px">
    </label>
    <label id="min-profit-label" style="display:none">Min Profit %
      <input type="number" id="min-profit" value="0.1" step="0.1" min="0" style="width:70px">
    </label>
    <label id="devig-label">Devig Method
      <select id="devig-select">
        <option value="power">Power (Pinnacle)</option>
        <option value="multiplicative">Multiplicative</option>
        <option value="additive">Additive</option>
      </select>
    </label>
    <label class="auto-refresh">
      <input type="checkbox" id="auto-refresh" checked> Auto (3s)
    </label>
    <button class="btn" id="refresh-btn" onclick="refresh()">Refresh</button>
  </div>

  <div class="stats-bar" id="stats-bar">
    <div class="stat"><span class="label" id="stat1-label">Bets Found</span><span class="value" id="stat1">—</span></div>
    <div class="stat"><span class="label" id="stat2-label">Best EV</span><span class="value" id="stat2">—</span></div>
    <div class="stat"><span class="label" id="stat3-label">Avg EV</span><span class="value" id="stat3">—</span></div>
    <div class="stat"><span class="label" id="stat4-label">Books</span><span class="value blue" id="stat4">—</span></div>
    <div class="stat"><span class="label">Last Update</span><span class="value" id="stat-time" style="font-size:14px;color:var(--text2)">—</span></div>
  </div>

  <div id="content">
    <div class="loading">Loading OddsJam data…</div>
  </div>
</div>

<script src="/betting-tools.js"></script>
</body>
</html>
