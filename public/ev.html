<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1316"><meta name="description" content="SportsLab market workspace for comparing entered sportsbook, exchange and fantasy prices.">
  <title>Market workspace · SportsLab</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script type="module" src="/ev.js?v=6"></script>
</head>
<body class="ev-page"><a class="skip" href="#main">Skip to market workspace</a><!--site-header-->
<main id="main" tabindex="-1">
  <header class="ev-header"><div class="ev-heading"><h1 id="ev-page-title">Positive EV</h1><span id="ev-data-kind" class="ev-data-badge">Manual prices</span></div><div class="ev-header-actions"><button type="button" id="ev-add-quote" class="button primary">Add price</button><button type="button" id="ev-import" class="button subtle">Import</button><button type="button" id="ev-export" class="button subtle">Export</button></div></header>
  <section class="ev-bookbar" aria-label="Bookmaker or platform filter"><div class="ev-book-list" id="ev-books"></div><button type="button" class="ev-book-more" id="ev-books-more" aria-expanded="false" hidden>+ more</button><span class="ev-book-divider" aria-hidden="true"></span><button type="button" class="ev-find-button" id="ev-find">Find bets <span aria-hidden="true">→</span></button></section>
  <div class="ev-control-grid"><div class="ev-stake-panel"><label>Bankroll <span title="A local display setting; no wager is placed">ⓘ</span><div class="ev-input-wrap"><input id="ev-ev-bankroll" type="number" min="1" step="0.01" value="5000" inputmode="decimal"><em>USD</em></div></label><label><span id="ev-multiplier-label">Kelly multiplier</span> <span title="Controls the suggested stake calculation">ⓘ</span><div class="ev-input-wrap"><input id="ev-kelly" type="number" min="0" max="1" step="0.05" value="0.25" inputmode="decimal"></div></label></div><div class="ev-filter-panel"><div class="ev-filter-heading"><strong>Filters</strong><label class="ev-recommend">Sort<select id="ev-sort-mode" aria-label="Sort opportunities"><option value="ev">Recommended</option><option value="event">Event</option><option value="odds">Odds</option></select></label><button type="button" id="ev-reset-filters">Clear all</button></div><div class="ev-toolbar"><label>Sport<select id="ev-sport"><option value="">All sports</option><option value="NFL">NFL</option><option value="MLB">MLB</option><option value="NBA">NBA</option><option value="WNBA">WNBA</option><option value="NHL">NHL</option><option value="Soccer">Soccer</option></select></label><label>Market<select id="ev-market-type"><option value="">All markets</option><option value="total">Totals</option><option value="spread">Spreads</option><option value="prop">Player props</option><option value="alternate">Alternates</option><option value="future">Futures</option><option value="three-way">Three-way</option></select></label><label id="ev-sharp-filter" hidden>Min liquidity<input id="ev-sharp-min" type="number" min="0" step="1" value="1000" inputmode="numeric"></label><label class="ev-search-label">Search<input id="ev-search" type="search" placeholder="Event, player, book…" autocomplete="off"></label></div><div class="ev-reference-filters" aria-label="Positive EV filters"><label><span aria-hidden="true">◉</span><select id="ev-reference-sport" aria-label="Sports"><option value="">All sports</option><option value="NFL">NFL</option><option value="MLB">MLB</option><option value="NBA">NBA</option><option value="WNBA">WNBA</option><option value="NHL">NHL</option><option value="Soccer">Soccer</option></select></label><label><span aria-hidden="true">♜</span><select id="ev-reference-league" aria-label="League"><option value="">All leagues</option></select></label><label><span aria-hidden="true">▥</span><select id="ev-reference-market" aria-label="Markets"><option value="">All markets</option></select></label><label class="ev-date-filter"><span aria-hidden="true">▣</span><span>Date Range</span><select id="ev-reference-date" aria-label="Observed date range"><option value="week">7 days</option><option value="today">Today</option><option value="all">All dates</option></select></label><label class="ev-odds-filter"><span aria-hidden="true">☷</span><span>Max Odds</span><select id="ev-reference-max-odds" aria-label="Maximum American odds"><option value="200">+200</option><option value="300">+300</option><option value="500">+500</option><option value="all">Any</option></select></label></div></div></div>
  <div class="ev-odds-tabs" id="ev-odds-tabs" hidden><button type="button" data-odds-tab="" aria-pressed="true">All markets</button><button type="button" data-odds-tab="prop" aria-pressed="false">Player props</button><button type="button" data-odds-tab="alternate" aria-pressed="false">Alt lines</button></div>
  <div id="ev-notice" class="ev-notice" role="status"></div>
  <div class="ev-shell"><aside class="ev-sidebar" aria-label="Other market tools"><details class="ev-tool-details"><summary>More tools</summary><label class="ev-mobile-picker">Choose tool<select id="ev-tool-select"></select></label><nav id="ev-tool-nav" aria-label="Market tools"></nav></details><div class="ev-quick-tools" hidden><button type="button" data-tool="ev-pre">Pregame EV</button><button type="button" data-tool="ev-live">Live EV</button><button type="button" data-tool="odds">Odds comparison</button></div></aside><div class="ev-main"><header class="ev-view-header"><div><h2 id="ev-title"></h2><p id="ev-description"></p></div><div class="ev-view-side"><span id="ev-record-count"></span><div id="ev-view-actions"></div></div></header><section id="ev-view" aria-live="polite"></section></div></div>
</main>
<dialog id="ev-detail" aria-labelledby="ev-detail-title"><div class="ev-detail-inner"><header><div><small>Market detail</small><h2 id="ev-detail-title"></h2></div><button type="button" id="ev-detail-close" aria-label="Close market detail">×</button></header><div id="ev-detail-body"></div></div></dialog>
<dialog id="ev-dialog" aria-labelledby="ev-dialog-title"><form id="ev-form" novalidate><header><h2 id="ev-dialog-title"></h2><button type="button" id="ev-close" aria-label="Close form">×</button></header><div id="ev-form-fields"></div><p id="ev-form-error" role="alert" hidden></p><footer><button type="button" id="ev-delete" class="button subtle" hidden>Delete</button><span></span><button type="button" id="ev-cancel" class="button subtle">Cancel</button><button type="submit" class="button primary">Save</button></footer></form></dialog>
<dialog id="ev-import-dialog" aria-labelledby="ev-import-title"><div class="ev-import-content"><header><h2 id="ev-import-title">Import market workspace</h2><button type="button" id="ev-import-close" aria-label="Close import">×</button></header><p>Choose a JSON export. Records replace the current browser workspace after validation.</p><input type="file" id="ev-file" accept=".json,application/json"><p id="ev-import-error" role="alert"></p><footer><button id="ev-import-cancel" class="button subtle">Cancel</button><button id="ev-import-apply" class="button primary">Import records</button></footer></div></dialog>
</body></html>
